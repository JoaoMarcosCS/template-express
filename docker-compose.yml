services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redisdata:/data

    # Habilita persistência AOF para manter dados em reinícios
    command: ["redis-server", "--appendonly", "yes"]

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_PORT: ${API_PORT}
        NODE_VERSION: ${NODE_VERSION}

    container_name: api

    env_file:
      - .env

    environment:
      DB_HOST: postgres
      REDIS_HOST: redis

    ports:
      - "${API_PORT}:${API_PORT}"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  pgdata:
  redisdata:
